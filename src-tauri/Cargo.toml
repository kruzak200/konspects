[package]
name = "konspects"
version = "0.1.0"
description = "Локальная библиотека конспектов"
authors = ["Alina"]
edition = "2021"

[lib]
name = "konspects_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.3"
base64 = "0.23.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# macOS (Apple Silicon / newer Xcode): do NOT strip proc-macros / build scripts.
# Cargo applies [profile.release] strip to them too; stripped .dylib macros then
# fail to dlopen (mis-aligned LINKEDIT), and rustc reports a misleading
# E0463 "can't find crate for `phf_macros`" (and similar). The final app binary
# is still stripped by the parent profile — this only affects compile-time crates.
[profile.release.build-override]
strip = false
opt-level = 0
